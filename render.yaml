# Render Blueprint: one web service (built from the Dockerfile) and one PostgreSQL database.
#
# Deploy:  Render dashboard → New → Blueprint → pick this repository → Apply.
# You are asked for two values: the administrator's email and password. Everything else
# is generated or wired up for you.
#
# The service is reachable at https://<name>.onrender.com straight away. To put it on your
# own domain behind Cloudflare, follow "Deploying" in the README.

databases:
  - name: cybergram-db
    databaseName: cybergram
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: cybergram
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Wired to the database above. Migrations and reference data are applied on start.
      - key: DATABASE_URL
        fromDatabase:
          name: cybergram-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"

      # Secrets generated by Render; never committed.
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      # The first administrator. Entered by you when the blueprint is applied; the account is
      # created on first start. Remove SEED_ADMIN_PASSWORD afterwards.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

      # Keeps job listings and the news desk fresh from inside the server process.
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "true"

      # One proxy (Render) sits in front of the app. Change to "2" once Cloudflare proxies the domain.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # Sign in with Google. Create an OAuth client in Google Cloud Console and paste the two
      # values here; the button appears on the sign-in page once both are set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Add these in the dashboard when you are ready (see the README):
      #   APP_URL                 https://your-domain  (once the custom domain is live)
      #   SMTP_URL, EMAIL_FROM    so verification and password-reset emails are delivered
      #   STORAGE_DRIVER=s3 and S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
      #                           (Cloudflare R2) so uploads survive restarts
